<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title if title else "LMS" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <div class="brand">
          <span class="brand-mark">LMS</span>
          <div>
            <p class="brand-title">LearningHub</p>
            <p class="brand-subtitle">Enable teams to learn together.</p>
          </div>
        </div>
        <nav class="nav-links">
          <a href="{{ url_for('index') }}">Overview</a>
          <a href="{{ url_for('courses') }}">Courses</a>
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('login') }}" class="cta">Login</a>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>LearningHub LMS · Built for modern teams</p>
        <div>
          <a href="{{ url_for('courses') }}">Course catalog</a>
          <a href="{{ url_for('dashboard') }}">Learner dashboard</a>
        </div>
      </div>
    </footer>
  </body>
</html>
